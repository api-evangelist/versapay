        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/exports/invoice_recon/{batch_file_id}:
    get:
      summary: Export/View Invoice Reconciliation Results
      description: View the most recent, or for a given batch import, invoice reconciliation results.
      tags:
      - File Imports
      parameters:
      - name: batch_file_id
        in: path
        required: true
        description: Optional, the `id` of the batch file import queued via /api/imports. When not specified the most recent invoice recon results are returned if any.
        schema:
          type: integer
      - name: watermark
        in: query
        description: The value to base a subsequent extract of the next 100 items.
        schema:
          $ref: '#/components/schemas/Watermark'
      - name: list
        in: query
        description: See Watermark & Limit for more information on response structure.
        schema:
          type: boolean
          example: true
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  reconciliation_invoices:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/InvoiceReconResponse'
              examples:
                reconciliation_invoices:
                  value:
                    reconciliation_invoices:
                      '213635737':
                        number: '0012'
                        division_code: null
                        customer_number: ''
                        customer_name: ''
                        invoice_date: null
                        payment_identifier: null
                        payment_date: null
                        orphaned_payment_amount: ''
                        balance_in_arc: ''
                        balance_in_source_system: $11,200.00
                        discrepancy_message: Invoice Not Present in ARC
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: getApiExportsInvoiceReconByBatchFileId
      x-operation-id-source: derived
  /api/exports/payment_recon/{batch_file_id}:
    get:
      summary: Export/View Payment Reconciliation Results
      description: View the most recent, or for a given batch import, payment reconciliation results.
      tags:
      - File Imports
      parameters:
      - name: batch_file_id
        in: path
        required: true
        description: Optional, the `id` of the batch file import queued via /api/imports. When not specified the most recent invoice recon results are returned if any.
        schema:
          type: integer
      - name: watermark
        in: query
        description: The value to base a subsequent extract of the next 100 items.
        schema:
          $ref: '#/components/schemas/Watermark'
      - name: list
        in: query
        description: See Watermark & Limit for more information on response structure.
        schema:
          type: boolean
          example: true
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  reconciliation_invoices:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/PaymentReconResponse'
              examples:
                reconciliation_invoices:
                  value:
                    reconciliation_payments:
                      '213635737':
                        payment_reconciliation_identifier: 7TSX9SFRY
                        unapplied_amount: $3,000.00
                        unapplied_amount_in_source_system: $90.00
                        customer_identifier: CUST123
                        discrepancy_message: 'These fields do not match: Payment date, Payment amount, Applied amount, Unapplied amount'
                        payment_amount: $3,000.00
                        payment_amount_in_source_system: $4,805.87
                        applied_amount: $0.00
                        applied_amount_in_source_system: $900.00
                        payment_date: '2021-08-31'
                        payment_date_in_source_system: '2023-08-07'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: getApiExportsPaymentReconByBatchFileId
      x-operation-id-source: derived
components:
  responses:
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Error message
                example: You need to sign in or create an account before continuing.
  schemas:
    InvoiceReconResponse:
      type: object
      properties:
        number:
          type: string
          description: The invoice number.
          example: 12
        division_code:
          type: string
          description: The division code associated with the invoice.
          example: HOM
        customer_number:
          type: string
          description: The customer identifier associated with the invoice.
          example: 1024
        customer_name:
          type: string
          description: The customer name associated with the invoice.
          example: Starblux Ltd
        invoice_date:
          type: string
          description: The invoice date.
          example: '2021-12-31'
        payment_identifier:
          type: string
          description: The identifier of any detected parked/orphan payment associated with the invoice.
        payment_date:
          type: string
          description: The date of any detected parked/orphan payment associated with the invoice.
        orphaned_payment_amount:
          type: string
          description: The amount of any detected parked/orphan payment associated with the invoice.
          example: $11,200.00
        balance_in_arc:
          type: string
          description: The invoice balance.
          example: $11,200.00
        balance_in_source_system:
          type: string
          description: The invoice balance in source/provided.
          example: $11,200.00
        discrepancy_message:
          type: string
          description: Message explaining the discrepancy.
          example: Invoice Not Present in ARC
    PaymentReconResponse:
      type: object
      properties:
        payment_reconciliation_identifier:
          type: string
          description: Identifier of the payment
        unapplied_amount:
          type: string
          description: The unapplied amount from total payment amount in Versapay.
        unapplied_amount_in_source_system:
          type: string
          description: The unapplied amount from total payment amount in source/provided.
        customer_identifier:
          type: string
          description: The customer number recorded on the payment in Versapay.
          example: CUST123
        discrepancy_message:
          type: string
          description: Message explaining the discrepancy.
          example: Payment Not Present in Versapay.
        payment_amount:
          type: string
          description: Optional, The payment amount in Versapay if present in uploaded recon csv.
        payment_amount_in_source_system:
          type: string
          description: Optional, The payment amount in source/provided if present in uploaded recon csv.
        applied_amount:
          type: string
          description: Optional, The amount applied from total payment amount in Versapay if present in uploaded recon csv.
        applied_amount_in_source_system:
          type: string
          description: Optional, The amount applied from total payment amount in source/provided if present in uploaded recon csv.
        external_payment_number:
          type: string
          description: Optional, The payment external number in Versapay if present in uploaded recon csv.
        external_payment_number_in_source_system:
          type: string
          description: Optional, The payment external number in source/provided if present in uploaded recon csv.
        payment_date:
          type: string
          description: Optional, Payment date in Versapay
          example: '2021-12-31'
        payment_date_in_source_system:
          type: string
          description: Optional, Payment date in source/provided if present in uploaded recon csv.
          example: '2021-12-31'
        currency:
          type: string
          description: Optional, The currency code in Versapay if present in uploaded recon csv.
        currency_in_source_system:
          type: string
          description: Optional, The currency code in source/provided if present in uploaded recon csv.
    Watermark:
      type: integer
      format: int64
      example: 0
    FileImport:
      type: object
      properties:
        id:
          type: string
          description: The import batch identifier.
          example: 21877
        file_name:
          type: string
          description: The original filename of the raw file.
          example: invoices.csv
        file_size:
          type: integer
          description: The original size of the raw file in bytes.
          example: 1024
        file_content_type:
          type: string
          description: The MIME/content-type of the raw file.
          example: text/plain
        file_fingerprint:
          type: string
          description: The fingerprint/hash representing the raw file contents.
          example: bf817b5548d69f6a3a49b6bb872fb906
        file_errors_count:
          type: string
          description: Number of records that failed import due to data error
          example: 5
        error:
          type: string
          description: The error message corresponding to a failed import.
          example: ''
        result_message:
          type: string
          description: Result of batch import.
          example: 5487 invoices
        complete_at:
          type: string
          description: The ISO8601 timestamp corresponding to completion of the import.
          example: '2016-08-30T15:39:30-04:00'
    LineItemResponse:
      type: object
      properties:
        number:
          type: string
          description: Invoice line-item number.
        description:
          type: string
          description: Invoice line-item description
        quantity:
          type: number
          description: Invoice line-item quantity.
        unit_cost_cents:
          type: integer
          description: Invoice line-item unit price in cents.
        amount_cents:
          type: integer
          description: Invoice line-item total in cents.
        balance_cents:
          type: integer
          description: Line-item balance in cents. Applicable if accepting short payments at line-item level.
        id:
          type: number
          description: Internal id of the line-item record.
        identifier:
          type: string
          description: Unique internal identifier for the line-item. Applicable if accepting short payments at line-item level.
        invoice_id:
          type: number
          description: Internal id of the invoice.
        purchase_order_number:
          type: string
          description: Purchase order number at the line-item level.
        order_key:
          type: string
          description: Sequence number for the line-item to order-by when rendering on the invoice.
        recurring_invoice_id:
          type: string
          description: Internal id of the recurring invoice. Applicable if using recurring invoices.
        extended_attributes:
          type: object
          description: Additional non-standard attribute stored with the line-item record for presentment rendering.
          properties:
            key:
              type: string
              description: Key-value pair of the extended attribute on the line-item.
    InvoiceResponse:
      type: object
      properties:
        number:
          type: string
          description: Invoice number, unique within a supplier.
        display_number:
          type: string
          description: Invoice number as displayed to customers.
        currency:
          type: string
          description: Currency code, based on ISO-4217, in lowercase. E.g. `cad`, `usd`, `aud`
        amount_cents:
          type: integer
          description: The invoice amount in cents.
        subtotal_tax1:
          type: string
          description: Tax amount, in dollars.
        subtotal_tax2:
          type: string
          description: Additional field to carry tax amount, in dollars. For example, when invoice shows state (provincial) and federal taxes.
        customer_identifier:
          type: string
          description: Unique identifier for customer.
        date:
          type: string
          format: date
          description: Invoice date, YYYY-MM-DD, based on ISO-8601.
        order_date:
          type: string
          format: date
          description: Order date, YYYY-MM-DD.
        due_date:
          type: string
          format: date
          description: Invoice due date, YYYY-MM-DD.
        purchase_order_number:
          type: string
          description: Purchase order number.
        notes_text:
          type: string
          description: Optional text field up to 64K.
        shipping_name:
          type: string
          description: 'Shipping address: recipient name'
        shipping_address:
          type: object
          description: Shipping address
          properties:
            address_1:
              type: string
              description: Shipping address, line 1
            address_2:
              type: string
              description: Shipping address, line 2
            city:
              type: string
              description: 'Shipping address: city'
            state:
              type: string
              description: 'Shipping address: state or province. Based on the second part (after hyphen) of codes in ISO 3166-2 standard. E.g. "ON" for Ontario, "CA" for California'
            country:
              type: string
              description: Shipping country code. E.g. "US" for USA.
            country_name:
              type: string
              description: Shipping country name.
            zip:
              type: string
              description: 'Shipping address: zip or postal code'
            line_1:
              type: string
              description: 'Single line combining shipping `address_1` and `address_2`.

                '
            line_2:
              type: string
              description: 'Single line combining shipping `city`, `state` and `zip`.

                '
        line_item_attributes:
          type: array
          description: Details of each line-item for the invoice.
          items:
            $ref: '#/components/schemas/LineItemResponse'
        auto_debit:
          type: boolean
          description: '`true` (invoice is to be auto-paid if customer has pre-authorized payment) or `false` (invoice is to be paid manually by customer)

            '
        division:
          type: string
          description: Division code, applicable when supplier supports divisions.
        auto_pay_reference:
          type: string
          description: Reference number associated to the invoice, used in AutoPay agreements.
        owing_cents:
          type: integer
          description: Balance remaining on this invoice or credit memo.
        status:
          type: string
          description: 'The status of the invoice. Can be one of `DRAFT`, `CURRENT`, `OVERDUE`, `PARTIAL`, `PAID`, `CREDIT` or `CLOSED`.

            '
          enum:
          - DRAFT
          - CURRENT
          - OVERDUE
          - PARTIAL
          - PAID
          - CREDIT
          - CLOSED
        delivery_status:
          type: string
          description: 'The delivery status of the invoice. Statuses in the API map to those in the UI as follows:<br>


            The email delivery statuses in the API reflect the following statuses from UI:


            |API Status|Status in the UI|

            |:--|:--|

            |`new`|"Not Tracked"|

            |`not_sent`|"Available"|

            |`sent`|"Email Sent"|

            |`delivery_unknown`|"Delivery Unknown"|

            |`not_delivered`|"Not Delivered"|

            |`delivered`|"Email Delivered"|

            |`opened`|"Email Opened"|

            |`clicked`|"Viewed"|

            '
          enum:
          - new
          - not_sent
          - sent
          - delivery_unknown
          - not_delivered
          - opened
          - clicked
        ref1:
          type: string
          description: A reference that is meaningful to the customer, e.g. Policy number, contract number, etc.
        ref2:
          type: string
          description: As above.
        ref3:
          type: string
          description: As above.
        adjustments_attributes:
          type: array
          description: Adjustments such as Fuel Surcharge or Discount on the invoice.
          items:
            type: object
            properties:
              label:
                type: string
                description: Label for adjustment amount.
              amount_cents:
                type: integer
                description: Adjustment amount in cents.
              id:
                type: integer
                description: Internal id of the adjustment.
              invoice_id:
                type: integer
                description: Internal id of the invoice.
              recurring_invoice_id:
                type: integer
                description: Internal id of the recurring invoice. Applicable when supplier is configured to create recurring invoices.
        plan_identifier:
          type: string
          description: Payment plan template identifier. Applicable when supplier is configured for payment plans.
        plan_start_date:
          type: string
          format: date
          description: Payment plan start date. Applicable when supplier is configured for payment plans.
        plan_end_date:
          type: string
          format: date
          description: Payment plan end date. Applicable when supplier is configured for payment plans.
        plan_payment_cents:
          type: integer
          description: Payment plan recurring payment amount in cents. Applicable when supplier is configured for payment plan.
        annualized_amount_cents:
          type: integer
          description: The annual invoice amount in cents. Applicable if the supplier is configured for payment plans.
        annualized_effective_date:
          type: string
          format: date
          description: The date that the annualized_amount takes effect. Applicable if the supplier is configured for payment plans.
        annualized_expiry_date:
          type: string
          format: date
          description: The end date of the period for which the annualized_amount is in effect. Applicable if the supplier is configured for payment plans.
        external_id:
          type: string
          description: Optional external identifier for the invoice to be included in payment exports.
        extended_attributes:
          type: object
          description: Additional non-standard attribute stored with the invoice record for presentment rendering.
          properties:
            key:
              type: string
              description: Key-value pair of the extended attribute on the invoice.
        summary_invoice_parent:
          type: string
          description: Flag that indicates if the invoice is a summary invoice. Default is 0 (invoice is not a summary invoice).
        summary_invoice_number:
          type: string
          description: If the invoice in the row is a child of a summary invoice, that summary invoice's identifier appears here.
        service_rep_email:
          type: string
          description: One or more supplier user email addresses (semi-colon delimited) that will be used for notification routing eg when in dispute each specified rep is notified only.
        pay_url:
          type: string
          description: The URL to the anonymous click-to-pay page.  This value is provided only for open invoices in an owing position.
        pay_urls:
          type: object
          description: Context sensitive URLs to click-to-pay page, keyed by recipient email addresses. These values are only provided for open invoices in an owing position.
          properties:
            key:
              type: string
              description: Key-value pair of the context sensitive click-to-pay URLs.
        deleted:
          type: boolean
          description: Indicates if the invoice has been deleted, this is optional and only present based on request parameter.
