openapi: 3.2.0
info:
  version: 1.3.35
  title: Versapay API Reference File Imports API
  contact:
    name: Versapay Support
    url: https://www.versapay.com/support
    email: support@versapay.com
  x-logo:
    url: https://developers.versapay.com/images/logo.png
  termsOfService: https://www.versapay.com/terms-of-use
  license:
    name: Copyright 2022 Versapay. All Rights Reserved.
  description: As a supplier you can upload customer, invoice, and payment data in CSV file formats.
servers:
- url: https://secure.versapay.com
  description: Production
- url: https://uat.versapay.com
  description: UAT
tags:
- name: File Imports
  description: As a supplier you can upload customer, invoice, and payment data in CSV file formats.
paths:
  /api/imports:
    post:
      summary: Import a CSV File
      description: 'When uploading a CSV-formatted file it’s helpful to use your language/framework tooling to simplify the multipart/form-data file upload.

        ### Size Limit

        The file cannot exceed 25MB.

        ### Layouts

        Please contact support@versapay.com or reach out to your implementation specialist for standard inbound CSV file layouts.'
      tags:
      - File Imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  type: string
                  description: The file to upload.
                filename:
                  type: string
                  description: Name of original file.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileImport'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      x-codeSamples:
      - lang: cURL
        source: 'curl \

          -u "Nvax...:UN0I..." \

          -F "filename=data.csv" \

          -F "file=@/home/user/Desktop/data.csv" \

          https://secure.versapay.com/api/imports/

          '
      - lang: Ruby
        source: 'file = { :file => File.new(''/home/user/Desktop/data.csv'') }

          auth = { :basic_auth => { :username => ''Nvax...'', :password => ''UN0I...'' } }

          HTTMultiParty.post(''https://secure.versapay.com/api/imports/'', auth.merge( :query => file ))

          '
      operationId: postApiImports
      x-operation-id-source: derived
    get:
      summary: View In-Progress & Completed Batches
      description: View recent in-progress and completed import batches.
      tags:
      - File Imports
      parameters:
      - name: page
        in: query
        description: 50 items are displayed per page.
        schema:
          type: integer
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileImport'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: getApiImports
      x-operation-id-source: derived
  /api/imports/processing:
    get:
      summary: View In-Progress Batches
      description: View only recent in-progress import batches.
      operationId: viewInProgressBatches
      tags:
      - File Imports
      parameters:
      - name: page
        in: query
        description: 50 items are displayed per page.
        schema:
          type: integer
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileImport'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/imports/completed:
    get:
      summary: View Completed Batches
      description: View only recent completed import batches.
      operationId: viewCompletedBatches
      tags:
      - File Imports
      parameters:
      - name: page
        in: query
        description: 50 items are displayed per page.
        schema:
          type: integer
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileImport'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/imports/{id}:
    get:
      summary: View Batch Details
      operationId: viewBatchDetail
      tags:
      - File Imports
      parameters:
      - name: id
        in: path
        required: true
        description: The import batch identifier.
        schema:
          type: string
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileImport'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/imports/{id}/echo:
    get:
      summary: View Tokenized Results of File Imported Payment Methods
      description: Tokenized results of file imported payment methods are available up to 24hrs following a fund import. This results file echo's the original input lines - absent the original header line, with sensitive field masking - appending the imported items `wallet token`, `fund token`, and `vault token` - i.e. essential references that can be used for subsequent payment/order transactions API usage.
      operationId: viewEchoResults
      tags:
      - File Imports
      parameters:
      - name: id
        in: path
        required: true
        description: The import batch identifier.
        schema:
          type: string
      responses:
        '200':
          description: Successful Operation
          content:
            text/csv:
              schema:
                type: string
              example: '1. Example of credit card import source text/csv:

                customer_identifier,name,first_name,last_name,number,expiry,postal_code,create_debit_agreement,auto_debit_reference

                10001,John Doe,John,Doe,4111111111111111,0318,H0H 0H0,Y,POLICY_10001

                10001,John Doe,John,Doe,5473500000000014,0318,H0H 0H0,Y,10001,John Doe,John,Doe,372700699251018,0318,H0H 0H0,N,

                10004,Mary Smith,Mary,Smith,4111111111111111,0318,H0H 0H0,Y,POLICY_10004

                10004,Mary Smith,Mary,Smith,5473500000000014,0318,H0H 0H0,Y,10004,Mary Smith,Mary,Smith,372700699251018,0318,H0H 0H0,N,


                2. Example of credit card import results text/csv:

                10001,John Doe,John,Doe,************1111,****,H0H 0H0,Y,POLICY_10001,1L8DN37Y6TL8,CC8KCKWWL8UT,ccuq905fyzruz9

                10001,John Doe,John,Doe,************0014,****,H0H 0H0,Y,,1L8DN37Y6TL8,CC3R9L5BDHI3,ccghc1fsa52tko

                10004,Mary Smith,Mary,Smith,************1111,****,H0H 0H0,Y,POLICY_10004,4JL6FH2L7LKN,CC851RBU5WGJ,ccg8c12dymulm1

                10004,Mary Smith,Mary,Smith,************0014,****,H0H 0H0,Y,,4JL6FH2L7LKN,CC2YDCF82NQK,ccom320nfnozj8'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/imports/{id}/errors:
    get:
      summary: View Batch Errors
      description: View the error results for a given batch import. This endpoint returns by default a `json` type response. But you can specify the extension in which you want to see the response, the accepted extensions are `json` and `csv`
      operationId: viewBatchError
      tags:
      - File Imports
      parameters:
      - name: id
        in: path
        required: true
        description: The import batch identifier.
        schema:
          type: string
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/InvoiceResponse'
              examples:
                message:
                  value:
                    message:
                    - line_number: 2
                      error: division id not specified
                      id: null
                      amount_cents: 73570
                      number: A00359X
                      due_date: '2022-08-01'
                      created_at: null
                      updated_at: null
                      sender_id: 4
                      customer_id: null
                      batch_id: 485
                      read_at: null
                      currency: cad
                      company_name: null
                      notes_header: null
                      notes_text: null
                      invoice_style: Product
                      date: '2022-07-01'
