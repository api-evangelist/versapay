openapi: 3.2.0
info:
  version: 1.3.35
  title: Versapay API Reference Authentication API
  contact:
    name: Versapay Support
    url: https://www.versapay.com/support
    email: support@versapay.com
  x-logo:
    url: https://developers.versapay.com/images/logo.png
  termsOfService: https://www.versapay.com/terms-of-use
  license:
    name: Copyright 2022 Versapay. All Rights Reserved.
  description: Visit your account settings in `UAT` (https://uat.versapay.com/account) or `Production` (https://secure.versapay.com/account) to setup API credentials needed for authentication as well as webhooks to receive relevant callbacks from Versapay transaction processing.
servers:
- url: https://secure.versapay.com
  description: Production
- url: https://uat.versapay.com
  description: UAT
tags:
- name: Authentication
  description: Visit your account settings in `UAT` (https://uat.versapay.com/account) or `Production` (https://secure.versapay.com/account) to setup API credentials needed for authentication as well as webhooks to receive relevant callbacks from Versapay transaction processing.
paths:
  /api/whoami:
    get:
      tags:
      - Authentication
      summary: Echo identity and account profile settings
      description: Lists key account profile settings configured for the authenticated account
      parameters:
      - name: options[jwt_expiry]
        in: query
        description: Number of days (1-365) until JWT expiration, default 30.
        schema:
          type: integer
      operationId: whoami
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  whoami:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Whoami'
