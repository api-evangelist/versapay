components:
  schemas:
    Divisions:
      type: object
      properties:
        division_code:
          type: string
          description: The division code
        division_name:
          type: string
          description: The division name
        parent_code:
          type:
          - string
          - 'null'
          description: The parent division code of the division
        company_name:
          type:
          - string
          - 'null'
          description: The division-specific company_name of the division
        address_1:
          type:
          - string
          - 'null'
          description: The division-specific address_1 of the division
        address_2:
          type:
          - string
          - 'null'
          description: The division-specific address_2 of the division
        postal_code:
          type:
          - string
          - 'null'
          description: The division-specific postal_code of the division
        city:
          type:
          - string
          - 'null'
          description: The division-specific city of the division
        province:
          type:
          - string
          - 'null'
          description: The division-specific state or province of the division
        country:
          type:
          - string
          - 'null'
          description: The division-specific country of the division
    DepositAccount:
      type: object
      description: A deposit account
      properties:
        purpose:
          type: string
          description: The purpose of the deposit account
        deposit_account_routing_number:
          type: string
          description: The routing number (if USD) of the deposit account associated with the merchant account
        deposit_account_masked_number:
          type: string
          description: A masked version of the deposit account number associated with the merchant account
        deposit_routing_account_hash_function:
          type: string
          description: The hash function used to mask the routing number and account number
        deposit_routing_account_hash:
          type: string
          description: A hash of the deposit routing number and deposit account number
    Whoami:
      type: object
      properties:
        token:
          type: string
          description: Owing account token
          example: 1UFLSWHF2HAK
        jwt:
          type: string
          description: Token that can be used for `Authorization Bearer` based JWT authentication
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ0b2tlbiI6Im54eDFaSjgzeXRNNmhtb3NGVExCIiwiZXhwIjoxNzEyOTU5NDA5fQ.adV6U1vW69Ypskt61uPL8hZ-4muvtM4FLM48QN6iCc4
        jwt_exp:
          type: integer
          description: Expiration date/time of the JWT token in seconds since 1970-01-01T00:00:00Z UTC ignoring leap seconds
          example: 1712959409
        name:
          type: string
          description: Owning account name
          example: CDS Netsuite UAT
        sender_identifier:
          type: string
          description: Supplier identifier
          example: cdsnsat
        currency:
          type: string
          description: Account default/base currency
          enum:
          - usd
          - eur
          - gbp
          - cad
          - aud
          example: usd
        preferred_language:
          type: string
          description: Account default/preferred language
          enum:
          - en
          - fr
          - es
          example: en
        external_link:
          type:
          - string
          - 'null'
          description: An external reference provided by the the ERP/partner originating the merchant application associated with this supplier
        business_number:
          type:
          - string
          - 'null'
          description: Tax/business number provided during account onboarding
          example: 325-223-3000
        address_1:
          type:
          - string
          - 'null'
        address_2:
          type:
          - string
          - 'null'
        postal_code:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        province:
          type:
          - string
          - 'null'
        country:
          type:
          - string
          - 'null'
        branding_partner:
          type:
          - string
          - 'null'
          description: The ERP/partner originating branding identifier
        branding_partner_config:
          type:
          - string
          - 'null'
          description: ERP/partner associated configuration settings
        merchant_accounts:
          type: array
          items:
            $ref: '#/components/schemas/MerchantAccount'
        settlement_bank_accounts:
          type: array
          items:
            $ref: '#/components/schemas/BankProcessor'
        terminal_processors:
          type: array
          items:
            $ref: '#/components/schemas/TerminalProcessor'
        gift_card_processors:
          type: array
          items:
            $ref: '#/components/schemas/GiftCardProcessor'
        divisions:
          type: array
          items:
            $ref: '#/components/schemas/Divisions'
        autopay_api_enabled:
          type: boolean
          description: If `true`, you are eligible to create AutoPay agreements via API
        arc_payment_match_mode:
          type: string
          description: C-AR Payment Manual Matching Mode (Off, On - Prepayments Only, On - All Payments)
        erp_payment_match_mode:
          type: string
          description: ERP Payments Manual Matching Mode (Off, On, Always Ask Customer)
        external_payment_match_mode:
          type: string
          description: External Payments Manual Matching Mode (Off, On, Always Ask Customer)
        erp_payment_auto_match_mode:
          type: boolean
          description: ERP Payments Auto Match Mode
        external_payment_auto_match_mode:
          type: boolean
          description: External Payments Auto Match Mode
    GiftCardProcessor:
      type: object
      properties:
        currency:
          type: string
          enum:
          - usd
          - gbp
          - eur
          - cad
          - aud
        token:
          type: string
          description: The gift card processor token
        deposit_account_masked_number:
          type:
          - string
          - 'null'
          description: 'A masked version of the deposit account number associated with the gift card processor

            '
        deposit_routing_account_hash:
          type: string
          description: 'A hash of the deposit routing number and deposit account number

            '
        deposit_routing_account_hash_function:
          type: string
          description: 'The hash function used to mask the routing number and account number

            '
        deposit_account_routing_number:
          type:
          - string
          - 'null'
          description: 'The routing number (if USD) of the deposit account associated with the gift card processor. If CAD, it is the concatenated institution number (3 digits) plus transit number (5 digits), If AUD, it is the BSB number. If GBP, it is the Sort Code. If EUR, it is “000000000”.

            '
        nickname:
          type:
          - string
          - 'null'
          description: 'Optional value that describes the gift card processor

            '
        gl_account:
          type:
          - string
          - 'null'
          description: 'Optional value that is the general ledger account number that is associated with the gift card processor deposits

            '
        mid:
          type:
          - string
          - 'null'
          description: 'The merchant id of the gift card processor

            '
        tid:
          type:
          - string
          - 'null'
          description: 'The terminal id of the gift card processor

            '
        is_default:
          type: boolean
          description: 'Default account for the account type for the specified currency

            '
    TerminalProcessor:
      type: object
      properties:
        currency:
          type: string
          enum:
          - usd
          - gbp
          - eur
          - cad
          - aud
        token:
          type: string
          description: The terminal processor token
        deposit_account_masked_number:
          type:
          - string
          - 'null'
          description: 'A masked version of the deposit account number associated with the terminal processor

            '
        deposit_routing_account_hash:
          type: string
          description: 'A hash of the deposit routing number and deposit account number

            '
        deposit_routing_account_hash_function:
          type: string
          description: 'The hash function used to mask the routing number and account number

            '
        deposit_account_routing_number:
          type:
          - string
          - 'null'
          description: 'The routing number (if USD) of the deposit account associated with the terminal processor. If CAD, it is the concatenated institution number (3 digits) plus transit number (5 digits), If AUD, it is the BSB number. If GBP, it is the Sort Code. If EUR, it is “000000000”.

            '
        nickname:
          type:
          - string
          - 'null'
          description: 'Optional value that describes the terminal processor

            '
        gl_account:
          type:
          - string
          - 'null'
          description: 'Optional value that is the general ledger account number that is associated with the terminal processor deposits

            '
        mid:
          type:
          - string
          - 'null'
          description: 'The merchant id of the terminal processor

            '
        tid:
          type:
          - string
          - 'null'
          description: 'The terminal id of the terminal processor

            '
        is_default:
          type: boolean
          description: 'Default account for the account type for the specified currency

            '
    MerchantAccount:
      type: object
      properties:
        acceptable_cards:
          type: string
          description: An array of accepted credit cards
        deposit_accounts:
          type: array
          items:
            $ref: '#/components/schemas/DepositAccount'
        currency:
          type: string
          enum:
          - usd
          - gbp
          - eur
          - cad
          - aud
        token:
          type: string
          description: The merchant account token
        deposit_account_masked_number:
          type:
          - string
          - 'null'
          description: 'A masked version of the deposit account number associated with the merchant account

            '
        deposit_routing_account_hash:
          type: string
          description: 'A hash of the deposit routing number and deposit account number

            '
        deposit_routing_account_hash_function:
          type: string
          description: 'The hash function used to mask the routing number and account number

            '
        deposit_account_routing_number:
          type:
          - string
          - 'null'
          description: 'The routing number (if USD) of the deposit account associated with the merchant account

            '
        nickname:
          type:
          - string
          - 'null'
          description: 'Optional value that describes the merchant account

            '
        gl_account:
          type:
          - string
          - 'null'
          description: 'Optional value that is the general ledger account number that is associated with the merchant account deposits

            '
        reference_token:
          type:
          - string
          - 'null'
          description: 'Optional value that describes the reference token provided by the source of the merchant application that resulted in this merchant account

            '
        mid:
          type:
          - string
          - 'null'
          description: 'The merchant id of the merchant account

            '
        tid:
          type:
          - string
          - 'null'
          description: 'The terminal id of the merchant account

            '
        is_default:
          type: boolean
          description: 'Default account for the account type for the specified currency

            '
        address:
          type:
          - object
          - 'null'
          properties:
            address_1:
              type:
              - string
              - 'null'
            address_2:
              type:
              - string
              - 'null'
            city:
              type:
              - string
              - 'null'
            province:
              type:
              - string
              - 'null'
              description: US state or CA province code
            postal_code:
              type:
              - string
              - 'null'
              description: US zip code or CA postal code
            country:
              type:
              - string
              - 'null'
              enum:
              - US
              - CA
    BankProcessor:
      type: object
      properties:
        token:
          type: string
          description: the bank account token
        currency:
          type: string
          enum:
          - usd
          - gbp
          - eur
          - cad
          - aud
        account_type:
          description: checking or savings, defaults checking (required country = US)
          type: string
          example: checking
        routing_number:
          description: "Financial institution branch/location. If USD, it is the routing number.\n  If CAD, it is the concatenated institution number (3 digits) plus transit number (5 digits),\n  If AUD, it is the BSB number. If GBP, it is the Sort Code. If EUR, it is “000000000”.\n"
          type: string
          example: ''
        masked_account_number:
          type: string
          description: a masked version of the account number
        routing_account_hash_function:
          type: string
          description: the hash function used to mask the routing number and account number
        routing_account_hash:
          type: string
          description: the hash value used to mask the routing number and account number.
        nickname:
          type:
          - string
          - 'null'
          description: 'Optional value that describes the bank account

            '
        reference_token:
          type:
          - string
          - 'null'
          description: 'Optional value that describes the reference token provided by the source of the merchant application that resulted in this settlement bank account

            '
        gl_number:
          type:
          - string
          - 'null'
