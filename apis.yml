url: https://raw.githubusercontent.com/api-evangelist/versapay/refs/heads/main/apis.yml
name: Versapay
kind: company
description: >-
  Versapay is a Toronto, Canada based B2B payments company focused on accounts
  receivable (AR) automation and integrated payment acceptance for suppliers and
  their buyers. Its "Collaborative AR" platform combines electronic invoicing,
  customer collaboration, cash application, and embedded payment processing so
  businesses can invoice, get paid, and reconcile inside one workflow, with
  ERP-adjacent integrations for order-to-cash. Versapay serves the North
  American mid-market and enterprise segment and, unlike consumer money-movement
  players in Canada's Interac-dominated market, sits in the API-native B2B
  acquiring and AR/AP money-movement layer. Its API posture is genuinely public
  and honest: developers.versapay.com hosts a Redocly-rendered reference for a
  broad REST platform API (onboarding, wallets, orders, order transactions, gift
  cards, card-present EMV, settlement reporting, autopay, customers, invoices,
  divisions, notifications, and webhooks) plus a separate hosted-iframe
  Ecommerce API for PCI-reduced payment sessions. Authentication is HTTPS Basic
  access authentication using an API Token and Key issued from the account
  console, with a UAT sandbox alongside production and a documented webhook
  event model.
