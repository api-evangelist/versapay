apis:
- aid: versapay:versapay-api-reference
  name: Versapay API Reference
  description: >-
    The core Versapay platform REST API (v1.3.35, OpenAPI 3.0.0, 86 documented
    paths) covering the Collaborative AR and payment-acceptance surface:
    onboarding applications, wallets, orders and order transactions, gift cards,
    card-present EMV, reference data, settlement reporting, autopay, customers,
    invoices and invoicing payments, divisions, notifications, collaboration,
    file imports, and webhooks. Authenticated with HTTPS Basic access
    authentication (API Token and Key) against a UAT sandbox and production.
  humanURL: https://developers.versapay.com/
  baseURL: https://secure.versapay.com
  tags:
  - Accounts Receivable
  - Payment Acceptance
  - Invoicing
  - Card Present
  - Webhooks
  properties:
  - type: OpenAPI
    url: openapi/versapay-api-reference.json
  - type: Documentation
    url: https://developers.versapay.com/
  - type: APIReference
    url: https://developers.versapay.com/
  - type: Overlay
    url: overlays/versapay-api-reference-overlay.yaml
  - type: ToolCrosswalk
    url: mcp/versapay-tool-crosswalk.yml
- aid: versapay:versapay-ecommerce-api
  name: Versapay Ecommerce API
  description: >-
    The Versapay Ecommerce server-side API (v2.0.0, OpenAPI 3.0.0, 11 documented
    paths) that configures payment sessions, manages customer wallets (credit
    cards and bank accounts), creates and captures order sales and payments,
    checks gift-card balances, and validates Apple Pay merchants. It pairs with
    a client-side JavaScript SDK and a Versapay-hosted iframe so sensitive
    payment data never transits the merchant application, reducing PCI scope.
    Served from https://{subdomain}.versapay.com/api/v2.
  humanURL: https://developers.versapay.com/ecommerce/
  baseURL: https://secure.versapay.com/api/v2
  tags:
  - Ecommerce
  - Payment Sessions
  - Wallets
  - Hosted Checkout
  properties:
