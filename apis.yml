- aid: versapay:versapay-authentication-api
  name: Versapay Authentication API
  description: >-
    Visit your account settings in `UAT` (https://uat.versapay.com/account) or `Production` (https://secure.versapay.com/account)
    to setup API credentials needed for authentication as well as webhooks to receive relevant callbacks
    from Versapay transaction processing.


    You can generate/disable your API credentials as often as necessary for security reasons.


    If you do not have an account, please contact Versapay Support for support & setup of AR invoicing
    integration, hosted checkout and/or payment acceptance for partner and/or API credential setup.


    ## API Token and API Key

    API requests are authenticated using `API Token & Key` via [HTTPS Basic Access Authentication](https://en.wikipedia.org/wiki/Basic_access_authentication).
    <table class="security-details"><tbody><tr><th> Security Scheme Type </th><td> <!-- -->HTTPS<!-- -->
    </td></tr><tr><th> HTTPS Authorization Scheme </th><td> <!-- -->basic<!-- --> </td></tr></tbody></table>


    Simply provide the `API Token & Key` values as the `user` and `password` parameters, using cURL for
    instance:


    `curl -u "Nvax...:UN0I..." -X POST https://secure.versapay.com/api/...`


    ## JWT Token

    Alternatively, API requests can also be authenticated using `JWT Token` via [HTTPS Bearer Authentication](https://en.wikipedia.org/wiki/JSON_Web_Token).
    <table class="security-details"><tbody><tr><th> Security Scheme Type </th><td> <!-- -->HTTPS<!-- -->
    </td></tr><tr><th> HTTP Authorization Scheme </th><td> <!-- -->bearer JWT<!-- --> </td></tr></tbody></table>

    `JWT Tokens`, automatically generated alongside `API Token & Key`, are displayed along with expiration
    in account settings as well as via authenticated `/api/whoami`, see `Authentication` _Echo identity
    and account profile settings_


    Simply provide the `JWT Token` in the authorization header, using cURL for instance:


    `curl -H "Authorization: Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ0b2tlbiI6Im54eDFaSjgzeXRNNmhtb3NGVExCIiwiZXhwIjoxNzEyOTU5NDA5fQ.adV6U1vW69Ypskt61uPL8hZ-4muvtM4FLM48QN6iCc4"
    -X POST https://secure.versapay.com/api/...`
