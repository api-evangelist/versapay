- aid: versapay:versapay-order-transactions-api
  name: Versapay Order Transactions API
  description: >-
    Order-based card/ACH and card present EMV payment transactions include verify, authorize, capture,
    sale, void, return refund, and return credit transaction types. If participating in a gift card program,
    gift cards can be used in sale, void, refund transaction types. Contact support@versapay.com for support
    & setup for Order Transactions enablement.

    ## Credit Card Payments

    There are two types of credit card payments: sale and delayed capture. Sale payments occur when the
    merchant wishes to accept a payment for goods or services that have already been shipped or provided
    to the cardholder. A sale is a financial transaction, and the movement of funds will be initiated
    in response to a sale request. Delayed capture payments are used when there is a separation between
    accepting an order and fulfilling that order. With delayed capture, the credit card is first authorized
    for the estimated order total. The authorization reserves funds on the cardholder’s account for the
    merchant but does not initiate a movement of funds. Once the products or services are ready to be
    delivered to the cardholder, the authorization is captured for the final amount. The capture request
    initiates the movement of funds.

    ## ACH Payments

    ACH payments are bank-to-bank transfers of funds. Unlike credit card payments, ACH payments only have
    one type – sale, and there is no prior authorization. Therefore, sale amounts are final and cannot
    be adjusted after the fact. ACH payments assume success, and if there is a problem with the funding
    source, like with a bounced paper check, the originator will be notified of a rejection several days
    after the payment attempt.

    ## EFT Payments

    EFT payments are bank-to-bank transfers of funds. Unlike credit card payments, EFT payments only have
    one type – sale, and there is no prior authorization. Therefore, sale amounts are final and cannot
    be adjusted after the fact. EFT payments assume success, and if there is a problem with the funding
    source, like with a bounced paper check, the originator will be notified of a rejection several days
    after the payment attempt.

    ## Gift Card Payments

    Provisioned gift cards can be activated/enabled (or deactivated/disabled) as well as have their balances
    loaded/re-loaded with an amount. Contact support@versapay.com for support & setup for Gift Card acceptance.

    ## Point-of-Sale/Card Present EMV Payments

    Card Present EMV payment transactions require a Versapay certified point-of-sale terminal. In addition
    to the card not present transaction types, the following payment transaction types are also supported:
    device setup, request signature, and cancel. Contact support@versapay.com for support & setup for
    POS/CP EMV enablement.
